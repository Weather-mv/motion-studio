<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Studio</title>
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<style>
  :root {
    --bg: #101216; --panel: #181b21; --field: #0d0f13; --line: #2a2f38;
    --text: #e7e9ee; --muted: #9aa2b1; --accent: #4f7cff; --accent-hover: #6b92ff;
    --good: #4cc38a; --warn: #f5b84a; --bad: #f2716b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 380px minmax(0, 1fr); background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  aside { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  textarea, input[type=text] { width: 100%; padding: 10px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  textarea { min-height: 200px; flex: 1 1 200px; resize: none; }
  textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .prompt { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text); font-size: 13px; font-weight: 400; }
  button { padding: 8px 12px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #generate { width: 100%; padding: 12px; color: #fff; background: var(--accent); border-color: var(--accent); font-size: 15px; font-weight: 600; }
  #generate:hover:not(:disabled) { background: var(--accent-hover); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #notice { padding: 10px; border-left: 3px solid var(--muted); background: var(--field); border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }
  #notice.good { border-color: var(--good); }
  #notice.bad { border-color: var(--bad); }
  #answer { display: none; padding: 10px; color: #17120a; background: var(--warn); border-radius: 6px; font-weight: 600; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; }
  nav { display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
  nav button { display: flex; align-items: center; gap: 8px; border: 0; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; color: var(--muted); }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ready { background: var(--good); }
  .dot.busy { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .term { flex: 1 1 auto; min-height: 0; padding: 8px 0 8px 10px; background: #000; display: none; }
  .term.active { display: block; }
  #stopped { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; background: var(--bg); font-size: 16px; padding: 16px; }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { height: 60vh; }
    textarea { min-height: 120px; }
  }
</style>
</head>
<body>
<aside>
  <h1>Motion Studio</h1>
  <div class="prompt">
    <label for="prompt">Video prompt</label>
    <textarea id="prompt" placeholder="Describe the video or the change you want."></textarea>
  </div>
  <button id="generate" disabled>Generate Video</button>
  <div id="answer" role="alert">Claude is waiting for your answer in the terminal.</div>
  <div id="notice" role="status">Connecting.</div>
  <div class="row">
    <div>
      <label for="folder">Project folder</label>
      <input id="folder" type="text" spellcheck="false" placeholder=". for the repo root">
    </div>
    <div>
      <label for="composition">Composition ID</label>
      <input id="composition" type="text" spellcheck="false" placeholder="Blank: choose when rendering">
    </div>
  </div>
  <label class="check"><input id="auto" type="checkbox"> Render automatically when Claude finishes changing files</label>
  <div class="actions">
    <button id="render">Render now</button>
    <button id="markReady" hidden>Claude is stuck: mark ready</button>
    <button id="restart" hidden>Restart Claude</button>
    <button id="shutdown">Stop server</button>
  </div>
</aside>
<main>
  <nav>
    <button id="tab-claude" class="active"><span class="dot" id="dot-claude"></span>Claude Code</button>
    <button id="tab-render"><span class="dot" id="dot-render"></span>Render</button>
  </nav>
  <div id="term-claude" class="term active"></div>
  <div id="term-render" class="term"></div>
</main>
<div id="stopped">The server has stopped. Run start.bat to open the dashboard again.</div>

<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/addon-fit/lib/addon-fit.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let socket = null;
  let activeTerm = 'claude';
  let serverStopped = false;
  let current = null; // last state from the server

  const send = (message) => {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  };

  // --- terminals ---
  function makeTerminal(name) {
    const term = new Terminal({
      cursorBlink: true,
      scrollback: 10000,
      fontFamily: 'Cascadia Mono, Consolas, monospace',
      fontSize: 13,
      theme: {background: '#000000'},
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open($('term-' + name));
    term.onData((data) => send({type: 'input', term: name, data}));
    // Ctrl+V pastes, and Ctrl+C copies when text is selected. With nothing selected, Ctrl+C reaches the program.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== 'keydown' || !e.ctrlKey || e.shiftKey || e.altKey) return true;
      const key = e.key.toLowerCase();
      if (key === 'v') return false;
      if (key === 'c' && term.hasSelection()) {
        navigator.clipboard.writeText(term.getSelection());
        term.clearSelection();
        return false;
      }
      return true;
    });
    return {term, fit};
  }
  const terms = {claude: makeTerminal('claude'), render: makeTerminal('render')};

  function fitActive() {
    const {term, fit} = terms[activeTerm];
    try { fit.fit(); } catch { return; }
    send({type: 'resize', term: activeTerm, cols: term.cols, rows: term.rows});
  }
  new ResizeObserver(fitActive).observe(document.querySelector('main'));

  function showTerm(name, focus) {
    activeTerm = name;
    for (const n of Object.keys(terms)) {
      $('term-' + n).classList.toggle('active', n === name);
      $('tab-' + n).classList.toggle('active', n === name);
    }
    fitActive();
    if (focus) terms[name].term.focus();
  }
  $('tab-claude').onclick = () => showTerm('claude', true);
  $('tab-render').onclick = () => showTerm('render', true);

  // --- state ---
  function setField(el, value) {
    if (document.activeElement !== el) el.value = value;
  }
  function render({state, config}) {
    current = state;
    const canSend = state.claude === 'ready' && !state.rendering;
    $('generate').disabled = !canSend;
    $('generate').textContent = state.claude === 'busy' ? 'Claude is working…' : state.rendering ? 'Rendering…' : 'Generate Video';
    $('render').disabled = state.rendering;
    $('markReady').hidden = !(state.claude === 'busy' || state.claude === 'starting');
    $('restart').hidden = state.claude !== 'stopped';
    $('answer').style.display = state.needsAnswer ? 'block' : 'none';
    $('notice').textContent = state.notice;
    $('notice').className = state.noticeKind;
    $('dot-claude').className = 'dot ' + (state.claude === 'ready' ? 'ready' : state.claude === 'stopped' ? 'bad' : 'busy');
    $('dot-render').className = 'dot ' + (state.rendering ? 'busy' : '');
    setField($('folder'), config.folder);
    setField($('composition'), config.composition);
    $('auto').checked = config.auto;
  }

  // --- controls ---
  const generate = () => {
    if (!$('generate').disabled) {
      send({type: 'generate', prompt: $('prompt').value});
      showTerm('claude', true);
    }
  };
  $('generate').onclick = generate;
  $('prompt').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.ctrlKey) generate();
  });
  $('render').onclick = () => {
    saveConfig();
    send({type: 'render'});
  };
  $('markReady').onclick = () => send({type: 'markReady'});
  $('restart').onclick = () => send({type: 'restartClaude'});
  $('shutdown').onclick = () => {
    const running = current && (current.claude === 'busy' || current.rendering);
    if (!running || window.confirm('Claude or a render is still running. Stop everything?')) send({type: 'shutdown'});
  };
  const saveConfig = () => send({type: 'config', folder: $('folder').value, composition: $('composition').value, auto: $('auto').checked});
  $('folder').addEventListener('change', saveConfig);
  $('composition').addEventListener('change', saveConfig);
  $('auto').addEventListener('change', saveConfig);

  // --- connection ---
  function connect() {
    socket = new WebSocket(`ws://${location.host}`);
    socket.onopen = fitActive;
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.type === 'output') terms[message.term].term.write(message.data);
      else if (message.type === 'clear') terms[message.term].term.reset();
      else if (message.type === 'state') render(message);
      else if (message.type === 'focus') showTerm(message.term, true);
      else if (message.type === 'shutdown') {
        serverStopped = true;
        $('stopped').style.display = 'flex';
      }
    };
    socket.onclose = () => {
      if (serverStopped) return;
      $('generate').disabled = true;
      $('notice').textContent = 'Lost the connection to the server. Retrying.';
      $('notice').className = 'bad';
      setTimeout(connect, 1500);
    };
  }
  connect();
</script>
</body>
</html>
